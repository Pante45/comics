
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block titulo %}Tienda de Cómics{% endblock %}</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            margin: 0;
        }

        header {
            background: #292929;
            color: white;
            padding: 25px;
            text-align: center;
        }

        nav {
            background: #414141;
            padding: 15px;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-weight: bold;
            margin: 0 15px;
        }

        nav a:hover {
            text-decoration: underline;
        }

        main {
            max-width: 1100px;
            margin: 30px auto;
            padding: 20px;
        }

        .precio {
            color: #087b46;
            font-weight: bold;
            font-size: 20px;
        }
    </style>

    {% block estilos %}{% endblock %}
</head>
<body>

    <header>
        <h1>Tienda de Cómics</h1>
        <p>Encuentra tu próximo cómic favorito</p>
    </header>

    <nav>
        <a href="{% url 'catalogo' %}">Inicio</a>
        <a href="{% url 'catalogo' %}">Catálogo</a>
    </nav>

    <main>
        {% block contenido %}
        {% endblock %}
    </main>

</body>
</html>
